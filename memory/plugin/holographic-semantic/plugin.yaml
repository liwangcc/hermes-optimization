name: holographic-semantic
version: 0.6.1
description: "Holographic memory + local semantic recall: wraps the holographic provider unchanged and adds a local embedding sidecar channel (BGE-M3 or a lighter pinned model) to prefetch (fail-open to lexical recall), a write-routing rule in the system prompt (fact_store by default, USER.md for the user, written for MEMORY.md off), plus an opt-in fact catalog in the system prompt with fact_store get by id."
